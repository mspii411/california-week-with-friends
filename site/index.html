    return `<article class="event"><div class="time">${e.time}</div>${destination?`<a class="photo-link" href="${destination.url}" target="_blank" rel="noopener" aria-label="Open ${esc(e.title)} location">${photo}</a>`:photo}<div class="body"><div class="kind">${eventType(e.title)}</div><h3>${destination?`<a href="${destination.url}" target="_blank" rel="noopener">${e.title} ↗</a>`:e.title}</h3><p>${e.desc}</p><div class="meta"><span class="pill ${e.tone}">● ${e.status}</span></div>${e.more?`<details><summary>Details</summary><div>${e.more}</div></details>`:''}${map&&map.url!==destination?.url?`<a class="map-link" href="${map.url}" target="_blank" rel="noopener">View map</a>`:''}</div></article>`;
  }).join('')}</div></section>`).join('');
  document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');const f=b.dataset.f;document.querySelectorAll('.day').forEach(d=>d.classList.toggle('hidden',f!=='all'&&d.dataset.day!==f));if(f!=='all')scrollTo({top:document.querySelector('main').offsetTop-55,behavior:'smooth'})});
  const sizeButton=document.getElementById('sizeToggle');let largeText=Number(localStorage.getItem('itineraryFontSize'))>16;
  const setSize=large=>{largeText=large;document.documentElement.style.setProperty('--base-size',large?'19px':'16px');sizeButton.setAttribute('aria-pressed',large);sizeButton.setAttribute('aria-label',large?'Use standard text':'Use larger text');sizeButton.title=large?'Text size: large':'Text size: standard';localStorage.setItem('itineraryFontSize',large?'19':'16')};setSize(largeText);
  sizeButton.onclick=()=>setSize(!largeText);
  const themeButton=document.getElementById('theme'),preferred=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';let activeTheme=localStorage.getItem('itineraryTheme')||preferred;
  const setTheme=t=>{activeTheme=t;document.documentElement.dataset.theme=t;themeButton.textContent=t==='dark'?'☀':'☾';themeButton.setAttribute('aria-pressed',t==='dark');themeButton.setAttribute('aria-label',t==='dark'?'Switch to light mode':'Switch to dark mode');document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#170b18':'#251126';localStorage.setItem('itineraryTheme',t)};setTheme(activeTheme);themeButton.onclick=()=>setTheme(activeTheme==='dark'?'light':'dark');
  const toast=document.getElementById('toast');document.getElementById('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,text:'California Week with Friends · October 18–25, 2026',url:location.href});else{await navigator.clipboard.writeText(location.href);toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}}catch{}};
  </script>
