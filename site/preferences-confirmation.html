ell"><section class="card" aria-labelledby="thanks"><div class="check" aria-hidden="true">✓</div><h2 id="thanks">Your preferences have been sent.</h2><p>Thanks for sharing. Todd and the group will use this only to help make California Week comfortable and enjoyable for everyone.</p><a class="button" href="index.html">Back to the itinerary</a></section></main><footer><div class="shell"><strong>California Week with friends</strong><br>October 18–25, 2026</div></footer></body></html>
