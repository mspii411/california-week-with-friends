name: Deploy production site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'infrastructure/preferences.yaml'
      - 'infrastructure/analytics.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Deploy guest preferences infrastructure
        run: >-
          aws cloudformation deploy
          --stack-name california-week-preferences
          --template-file infrastructure/preferences.yaml
          --region us-east-2
          --no-fail-on-empty-changeset
          --capabilities CAPABILITY_IAM
      - name: Deploy first-party analytics infrastructure
        run: >-
          aws cloudformation deploy
          --stack-name california-week-analytics
          --template-file infrastructure/analytics.yaml
          --region us-east-2
          --no-fail-on-empty-changeset
          --capabilities CAPABILITY_IAM
      - name: Write public preferences API configuration
        run: |
          set -euo pipefail
          api_url="$(aws cloudformation describe-stacks --stack-name california-week-preferences --region us-east-2 --query "Stacks[0].Outputs[?OutputKey=='PreferencesApiEndpoint'].OutputValue" --output text)"
          test -n "$api_url"
          printf "window.GUEST_PREFERENCES_API_URL = '%s';\\n" "$api_url" > site/preferences-config.js
      - name: Write public analytics configuration
        run: |
          set -euo pipefail
          analytics_url="$(aws cloudformation describe-stacks --stack-name california-week-analytics --region us-east-2 --query "Stacks[0].Outputs[?OutputKey=='AnalyticsEndpoint'].OutputValue" --output text)"
          test -n "$analytics_url"
          printf "window.CALIFORNIA_WEEK_ANALYTICS = { endpoint: '%s' };\\n" "$analytics_url" > site/analytics-config.js
      - name: Stamp the deployed build version
        run: |
          build_version="$(git rev-parse --short HEAD)"
          find site -name '*.html' -exec sed -i "s/__BUILD_VERSION__/$build_version/g" {} +
      - name: Enable analytics on public pages
        run: |
          find site -name '*.html' -exec sed -i 's#</body>#<script src="analytics-config.js"></script><script src="analytics.js"></script></body>#' {} +
          printf '<script src="analytics-config.js"></script><script src="analytics.js"></script></body></html>\\n' >> site/index.html
      - name: Synchronize immutable assets
        run: >-
          aws s3 sync site/ s3://california-week-with-friends-778977181879/ --delete
          --exclude '*.html'
          --cache-control 'public,max-age=31536000,immutable'
      - name: Upload HTML pages without browser caching
        run: >-
          aws s3 cp site/ s3://california-week-with-friends-778977181879/ --recursive
          --exclude '*' --include '*.html'
          --cache-control 'no-cache,no-store,must-revalidate'
          --content-type 'text/html; charset=utf-8'
      - name: Upload preferences API configuration
        run: >-
          aws s3 cp site/preferences-config.js s3://california-week-with-friends-778977181879/preferences-config.js
          --cache-control 'no-cache,no-store,must-revalidate'
          --content-type 'application/javascript; charset=utf-8'
      - name: Upload analytics configuration
        run: >-
          aws s3 cp site/analytics-config.js s3://california-week-with-friends-778977181879/analytics-config.js
          --cache-control 'no-cache,no-store,must-revalidate'
          --content-type 'application/javascript; charset=utf-8'
      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id 'EAFGKRFTB0B20'
          --paths '/*'
