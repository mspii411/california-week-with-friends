name: Deploy production site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Synchronize immutable assets
        run: >-
          aws s3 sync site/ s3://${{ vars.S3_BUCKET }}/ --delete
          --exclude index.html
          --cache-control 'public,max-age=31536000,immutable'
      - name: Upload the HTML entry point
        run: >-
          aws s3 cp site/index.html s3://${{ vars.S3_BUCKET }}/index.html
          --cache-control 'no-cache,no-store,must-revalidate'
          --content-type 'text/html; charset=utf-8'
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id '${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}' --paths '/*'

