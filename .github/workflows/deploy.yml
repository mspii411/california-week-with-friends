name: Deploy production site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Debug secrets presence
        run: |
          echo "Key ID length: ${#AWS_ACCESS_KEY_ID}"
          echo "Secret length: ${#AWS_SECRET_ACCESS_KEY}"
          echo "Region: $AWS_REGION"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Synchronize immutable assets
        run: >-
          aws s3 sync site/ s3://${{ vars.S3_BUCKET }}/ --delete
          --exclude index.html
          --cache-control 'public,max-age=31536000,immutable'
      - name: Upload the HTML entry point
        run: >-
          aws s3 cp site/index.html s3://${{ vars.S3_BUCKET }}/index.html
          --cache-control 'no-cache,no-store,must-revalidate'
          --content-type 'text/html; charset=utf-8'
      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id '${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}'
          --paths '/*'
